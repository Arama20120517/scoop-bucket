name: Pull Requests Handler

on:
  pull_request:
    types:
      - opened

jobs:
  pr_handler:
    name: Pull Request Handler
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'renovate[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull Request Handler
        uses: ScoopInstaller/GithubActions@6f888fbdd6bc1cda256c7e9f649be9d305284e7b # main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
